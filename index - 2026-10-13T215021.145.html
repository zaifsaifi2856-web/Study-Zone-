        /* Base Resets */
        * {

            will-change: transform;
            -webkit-font-smoothing: antialiased;

        /* --- THE SHINE EFFECT (Text Animation) --- */
        .text-shine {
            background-size: 200% auto;
            color: #000;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Colorful Gradient Palettes for Text */
        .grad-blue-cyan { background-image: linear-gradient(to right, #00c6ff, #0072ff, #00c6ff); }

        .grad-purple-pink { background-image: linear-gradient(to right, #c471ed, #f64f59, #c471ed); }

        .grad-rose { background-image: linear-gradient(to right, #ff0844, #ffb199, #ff0844); }

        .grad-youtube { background-image: linear-gradient(to right, #f5576c, #f093fb, #f5576c); }

        .card-light {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .card-dark {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Fluid Entrance Animation */
        @keyframes popUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-pop {
            animation: popUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            will-change: transform, opacity;
        }

        /* Flashy Animated Background Mesh */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                        radial-gradient(at 0% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            background-size: 200% 200%;
            animation: meshGradient 10s ease infinite;
        }
        .dark .bg-mesh {
            background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            background-color: #000000;
        }
        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>

    <script>
        // --- LIVE CLOCK ---
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            h = h % 12 || 12; 
            document.getElementById('liveTime').innerText = `${h}:${m}`;
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- THEME TOGGLE (OLED / PEARL) ---
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // --- WAKELOCK (Anti-Black Screen Fix) ---
        document.addEventListener('click', function() {
            let vid = document.getElementById('wakeLockEngine');
            if (vid && vid.paused) vid.play().catch(e => console.log("WakeLock deferred"));
        }, { once: true });

        // --- APP LAUNCHER (Fixes WebView Loading) ---
        function launchApp(url) {
            if (!url) return;
            // Force link to open properly without freezing HTML to APK wrappers
            window.location.href = url;
        }
    </script>
</body>
</html>
